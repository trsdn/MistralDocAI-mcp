name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22.x', '24.x']
        include:
          - os: macos-latest
            node-version: '24.x'
          - os: windows-latest
            node-version: '24.x'

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:ci

      - name: Verify the publishable artifact
        run: npm pack --dry-run

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/mcp_requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/mcp_requirements.txt

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .

      # This is the regression guard for the 1.0.4 breakage: an unbounded
      # dependency range resolved to an incompatible major version, so every
      # fresh install crashed before a client could list a single tool.
      - name: Verify the MCP server contract
        run: python3 scripts/verify_python_server.py

  end-to-end:
    name: End-to-end setup / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [node, python]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Exercises the real path a user takes: create the virtual environment,
      # install the Python dependencies and import the server.
      - name: Run the bundled setup test
        run: npm run test:smoke
