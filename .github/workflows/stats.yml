name: Repository stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    uses: trsdn/.github/.github/workflows/repo-stats.yml@main
    with:
      output-dir: .github/stats
      theme: both
      cards: repo-card
      commit-message: "chore(stats): update repository stats"
      branch: stats
