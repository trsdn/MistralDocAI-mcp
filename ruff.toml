# Linting configuration for the Python side of the MCP server.
# Kept in sync with the Python versions declared in python/mcp_requirements.txt.

target-version = "py310"
line-length = 120

include = ["python/**/*.py", "scripts/**/*.py"]

# The server runs with python/ on sys.path, so modules in there are first-party.
# Ruff otherwise falls back to a same-package heuristic, and python/ has no
# __init__.py for that heuristic to key off. The fallback classified docmistral
# as first-party under 0.16.3 but not under 0.16.4, so import sorting passed
# locally and failed in CI.
src = ["python", "scripts"]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # comprehensions
  "SIM", # simplifications
]

[lint.per-file-ignores]
# The verification script deliberately catches every import-time failure.
"scripts/verify_python_server.py" = ["BLE001"]

[lint.isort]
# Belt and braces with src above: naming the module leaves nothing to infer,
# whichever Ruff version runs.
known-first-party = ["docmistral"]
